<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%" style="background:#120D09; font-family:'Plus Jakarta Sans', system-ui, sans-serif;">
  <defs>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35281E"/>
      <stop offset="100%" stop-color="#16100B"/>
    </linearGradient>
    <linearGradient id="cognacGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B86B38"/>
      <stop offset="100%" stop-color="#92542B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Title & Watermark -->
  <text x="60" y="55" fill="#F8F5EE" font-size="26" font-weight="700" letter-spacing="-0.5px">FloodLock™ Multi-Cloud Production Architecture</text>
  <text x="60" y="80" fill="#D6C5B3" font-size="13" font-weight="500">Zero-Cost High Availability Edge Topology • T+5 Escrow • Real-Time Neural Hydrology</text>

  <!-- Layer 1: Client Edge -->
  <g filter="url(#shadow)">
    <rect x="60" y="120" width="1080" height="90" rx="14" fill="url(#coatGrad)" stroke="#D6C5B3" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="90" y="155" fill="#D6C5B3" font-size="11" font-weight="700" letter-spacing="1px">TIER 1: CLIENT PRESENTATION &amp; 3D LIQUID DOCK</text>
    <text x="90" y="185" fill="#F8F5EE" font-size="18" font-weight="600">Global Citizen Web App • PWA Mobile • Vector MapLibre GL • Apple-Style 3D Dock</text>
    <rect x="940" y="145" width="170" height="40" rx="8" fill="#92542B" fill-opacity="0.3" stroke="#92542B"/>
    <text x="965" y="170" fill="#F8F5EE" font-size="12" font-weight="600">Sub-100ms Global CDN</text>
  </g>

  <!-- Connecting Bus -->
  <path d="M 600 210 L 600 260" stroke="#92542B" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Layer 2: Cloudflare Global Edge Gateway -->
  <g filter="url(#shadow)">
    <rect x="60" y="260" width="1080" height="110" rx="14" fill="url(#coatGrad)" stroke="#92542B" stroke-width="2"/>
    <text x="90" y="295" fill="#D6C5B3" font-size="11" font-weight="700" letter-spacing="1px">TIER 2: CLOUDFLARE V8 WORKERS EDGE GATEWAY</text>
    <text x="90" y="325" fill="#F8F5EE" font-size="18" font-weight="600">API Key Auth • Quota Rate-Limiter • PII Scrubber • T+5 Escrow Webhook Router</text>
    <text x="90" y="350" fill="#788279" font-size="13">100,000 Free Req/Day • Automatic Global Edge Caching • Zero Cold Start</text>
    <rect x="940" y="295" width="170" height="40" rx="8" fill="url(#cognacGrad)"/>
    <text x="975" y="320" fill="#F8F5EE" font-size="13" font-weight="700">&lt;15ms Latency</text>
  </g>

  <!-- Connecting Buses to Backend -->
  <path d="M 280 370 L 280 430" stroke="#788279" stroke-width="2.5"/>
  <path d="M 600 370 L 600 430" stroke="#92542B" stroke-width="2.5"/>
  <path d="M 920 370 L 920 430" stroke="#788279" stroke-width="2.5"/>

  <!-- Subsystem A: Supabase Data & Escrow -->
  <g filter="url(#shadow)">
    <rect x="60" y="430" width="340" height="220" rx="14" fill="url(#coatGrad)" stroke="#D6C5B3" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="80" y="450" width="100" height="24" rx="6" fill="#35281E" stroke="#D6C5B3" stroke-opacity="0.3"/>
    <text x="90" y="466" fill="#D6C5B3" font-size="10" font-weight="700">PERSISTENCE</text>
    <text x="80" y="505" fill="#F8F5EE" font-size="17" font-weight="600">Supabase PostgreSQL</text>
    <text x="80" y="535" fill="#D6C5B3" font-size="13">• Google &amp; GitHub OAuth 2.0</text>
    <text x="80" y="560" fill="#D6C5B3" font-size="13">• 18+ Age Verification Tokens</text>
    <text x="80" y="585" fill="#D6C5B3" font-size="13">• T+5 Escrow Purchase Ledger</text>
    <text x="80" y="610" fill="#D6C5B3" font-size="13">• Citizen Flood Report Store</text>
    <text x="80" y="635" fill="#92542B" font-size="12" font-weight="600">→ Auto Email to lantern.mech</text>
  </g>

  <!-- Subsystem B: AI & Neural Hydrology Engine -->
  <g filter="url(#shadow)">
    <rect x="430" y="430" width="340" height="220" rx="14" fill="url(#coatGrad)" stroke="#92542B" stroke-width="2"/>
    <rect x="450" y="450" width="130" height="24" rx="6" fill="#92542B" fill-opacity="0.3" stroke="#92542B"/>
    <text x="460" y="466" fill="#F8F5EE" font-size="10" font-weight="700">NEURAL ENGINE</text>
    <text x="450" y="505" fill="#F8F5EE" font-size="17" font-weight="600">Hydrology Temporal Model</text>
    <text x="450" y="535" fill="#D6C5B3" font-size="13">• 1.2B Temporal CNN-LSTM</text>
    <text x="450" y="560" fill="#D6C5B3" font-size="13">• Ingests CAPE, Tide, Soil Sat</text>
    <text x="450" y="585" fill="#D6C5B3" font-size="13">• Google Colab T4 Training</text>
    <text x="450" y="610" fill="#D6C5B3" font-size="13">• Client-Side ONNX WebGL</text>
    <text x="450" y="635" fill="#92542B" font-size="12" font-weight="600">→ 12ms Inference Per Basin</text>
  </g>

  <!-- Subsystem C: Multi-Cloud Cold Storage & Compute -->
  <g filter="url(#shadow)">
    <rect x="800" y="430" width="340" height="220" rx="14" fill="url(#coatGrad)" stroke="#D6C5B3" stroke-opacity="0.25" stroke-width="1.5"/>
    <rect x="820" y="450" width="120" height="24" rx="6" fill="#35281E" stroke="#D6C5B3" stroke-opacity="0.3"/>
    <text x="830" y="466" fill="#D6C5B3" font-size="10" font-weight="700">STORAGE &amp; COMPUTE</text>
    <text x="820" y="505" fill="#F8F5EE" font-size="17" font-weight="600">Cloudflare R2 + 15TB Cloud</text>
    <text x="820" y="535" fill="#D6C5B3" font-size="13">• Zero-Egress Model Downloads</text>
    <text x="820" y="560" fill="#D6C5B3" font-size="13">• GGUF &amp; PyTorch Binaries</text>
    <text x="820" y="585" fill="#D6C5B3" font-size="13">• HuggingFace Spaces Fallback</text>
    <text x="820" y="610" fill="#D6C5B3" font-size="13">• Dell Mint Server Cloudflare Tunnel</text>
    <text x="820" y="635" fill="#92542B" font-size="12" font-weight="600">→ 100% Free High Availability</text>
  </g>
</svg>